interface:
  display_name: "Blockbench Minecraft Authoring"
  short_description: "Ruin's MCPでMinecraftモデル・UV・テクスチャを制作"
  default_prompt: "$blockbench-minecraft-authoring を使って、Minecraft向けモデル・UV・テクスチャを一貫して作成して。制作前に参照計画を必ず立て、完全一致する画像がなくても観察用参照を使い、パーツごとに中間色で滑らかにつながる陰影を作り、全体の可視面へ材質に合った近似色テクスチャノイズを書き込んで。"
policy:
  allow_implicit_invocation: true
